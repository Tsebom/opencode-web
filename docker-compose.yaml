services:
  opencode:
    build: .
    container_name: opencode-standalone
    ports:
      - "${OPENCODE_PORT:-4096}:${OPENCODE_PORT:-4096}"
    volumes:
      - ./.opencode/opencode.jsonc:/home/agent/.config/opencode/opencode.jsonc:ro
      - ./.opencode/ssh:/home/agent/.ssh:rw
    environment:
      - OPENCODE_PORT=${OPENCODE_PORT:-4096}
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD}
      - WORMSOFT_API_KEY=${WORMSOFT_API_KEY}
      - POLZA_API_KEY=${POLZA_API_KEY}
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${OPENCODE_PORT:-4096}/api/info", "-u", "opencode:${OPENCODE_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
