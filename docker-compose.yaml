services:
  opencode:
    build: .
    container_name: opencode-standalone
    ports:
      - "${OPENCODE_PORT:-4096}:4096"
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ./.opencode/opencode.jsonc:/home/agent/.config/opencode/opencode.jsonc:ro
      - ./.opencode/ssh:/home/agent/.ssh:rw
      # Persist the OpenCode service state (sessions, etc.) across container recreations
      - opencode-data:/home/agent/.local/share/opencode
      # Persist the working directory (cloned repos, agent work) across
      # container recreations. /workspace is created in the image with
      # agent:agent ownership, so the volume is initialized with correct
      # permissions (Docker creates missing volume mount points as root)
      - opencode-workspace:/workspace
      # Persist code-server (VS Code in the browser) state across container
      # recreations: VS Code server download cache and user extensions
      - code-server-data:/home/agent/.local/share/code-server
    environment:
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD}
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD}
      - WORMSOFT_API_KEY=${WORMSOFT_API_KEY}
      - POLZA_API_KEY=${POLZA_API_KEY}
      - CONTEXT7_API_KEY=${CONTEXT7_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/api/info", "-u", "opencode:${OPENCODE_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  opencode-data:
  opencode-workspace:
  code-server-data:
